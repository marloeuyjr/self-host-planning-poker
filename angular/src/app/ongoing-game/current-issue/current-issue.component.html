<ng-container *ngIf="(hasBacklog$ | async)">
  <div class="current-issue" *transloco="let t; read 'currentIssue'">
    <ng-container *ngIf="(currentIssue$ | async) as issue; else noIssue">
      <div class="current-issue__head">
        <span class="current-issue__key">{{ issue.key }}</span>
        <span class="current-issue__summary">{{ issue.summary }}</span>
        <button *ngIf="issue.description"
                type="button"
                class="current-issue__toggle"
                (click)="toggleDescription()"
                [attr.aria-expanded]="descriptionExpanded">
          {{ descriptionExpanded ? t('hide-detail') : t('show-detail') }}
        </button>
        <button *ngIf="(isDriver$ | async) && (issue.status === 'pending' || issue.status === 'estimating')"
                type="button"
                class="current-issue__toggle"
                (click)="togglePark()"
                [attr.aria-expanded]="parkExpanded">
          {{ t('park') }}
        </button>
      </div>
      <p *ngIf="descriptionExpanded && issue.description" class="current-issue__description">{{ issue.description }}</p>
      <div *ngIf="parkExpanded" class="current-issue__park">
        <input type="text" class="form-control form-control-sm current-issue__park-reason"
               [(ngModel)]="parkReason" [placeholder]="t('park-reason-placeholder')">
        <button type="button" class="current-issue__toggle" (click)="park('refinement')">{{ t('park-refine') }}</button>
        <button type="button" class="current-issue__toggle" (click)="park('skipped')">{{ t('park-skip') }}</button>
      </div>
    </ng-container>
    <ng-template #noIssue>
      <!-- The driver gets the actionable instruction; everyone else is waiting on them,
           not on a queue they can't drive — don't hand them a dead-end instruction. -->
      <span class="current-issue__hint">{{ (isDriver$ | async) ? t('none-selected') : t('waiting-driver') }}</span>
    </ng-template>
  </div>
</ng-container>
