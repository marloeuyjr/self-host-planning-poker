<div class="container d-flex overflow-auto align-items-center h-100 pt-5 pb-md-5 pb-2" *ngIf="deck">
  <div class="flex-grow-1"></div>
  <shpp-pickable-card *ngFor="let card of deck.values; let i = index"
             [cardValue]="card"
             [keyHint]="keyHintFor(i)"
             [disabled]="isSpectator || isGameRevealed"
             [selected]="selectedCard === card"
             [attr.tabindex]="(isGameRevealed || isSpectator) ? -1 : 0"
             role="button"
             (click)="selectCard(card)"
             (keydown.enter)="selectCard(card)"
             (keydown.space)="selectCard(card); $event.preventDefault()">
  </shpp-pickable-card>
  <div class="flex-grow-1"></div>
</div>
