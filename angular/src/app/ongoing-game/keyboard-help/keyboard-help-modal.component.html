<ng-container *transloco="let t; read 'keyboardHelp'">
  <div class="modal-header">
    <h4 class="modal-title">{{ t('title') }}</h4>
    <button *transloco="let b; read 'buttons'"
            type="button" class="btn-close"
            [attr.aria-label]="b('close')"
            (click)="activeModal.close()"></button>
  </div>
  <div class="modal-body">
    <dl class="shortcuts">
      <dt><kbd>1</kbd>&hellip;<kbd>0</kbd></dt>
      <dd>{{ t('pick') }}<span class="shortcuts__note">{{ t('unpick') }}</span></dd>

      <dt><kbd>Enter</kbd></dt>
      <dd>{{ t('reveal') }} · {{ t('advance') }} · {{ t('accept') }}</dd>

      <dt><kbd>n</kbd></dt>
      <dd>{{ t('next') }}</dd>

      <dt><kbd>p</kbd></dt>
      <dd>{{ t('prev') }}</dd>

      <dt><kbd>d</kbd></dt>
      <dd>{{ t('detail') }}</dd>

      <dt><kbd>?</kbd></dt>
      <dd>{{ t('help') }}</dd>

      <dt><kbd>Esc</kbd></dt>
      <dd>{{ t('close') }}</dd>
    </dl>
  </div>
</ng-container>
