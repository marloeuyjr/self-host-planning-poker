<ng-container *ngIf="playerState">
  <div class="d-flex flex-column align-items-center m-2 m-sm-5">
    <div class="card-border"
         [class.card-disabled]="playerState.spectator"
         [class.face-down]="playerState.hasPicked && playerState.hand === undefined"
         [class.dashed]="playerState.spectator || !playerState.hasPicked">
      <div class="card-value" *ngIf="playerState.hand !== undefined && deck">
        {{ displayCardValue(deck, playerState.hand) }}
      </div>
      <div class="card-value" *ngIf="playerState.spectator">
        <svg *transloco="let t" [attr.aria-label]="t('playerState.spectator')" role="img"
             class="bi bi-eye-fill" width="1em" height="1em" fill="currentColor">
          <use xlink:href="assets/bootstrap-icons.svg#eye-fill"/>
        </svg>
      </div>
    </div>
    <div class="player-name mt-1">
      {{ playerState.name }}
    </div>
    <ng-container *transloco="let t">
      <!-- Pre-reveal pick state is otherwise carried only by the face-down/dashed card
           styling — give assistive tech the same signal in text. (Spectators get the
           eye icon's label; a revealed hand shows its value directly.) -->
      <span class="visually-hidden" *ngIf="!playerState.spectator && playerState.hand === undefined">
        {{ playerState.hasPicked ? t('playerState.has-picked') : t('playerState.waiting') }}
      </span>
      <span class="player-driver-tag" *ngIf="isDriver">{{ t('playerState.driver') }}</span>
    </ng-container>
  </div>
</ng-container>
