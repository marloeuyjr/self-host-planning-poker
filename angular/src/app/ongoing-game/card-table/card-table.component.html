<div class="container flex-grow-1 d-flex justify-content-evenly flex-wrap align-items-center">
  <shpp-player-hand *ngFor="let player of (state | keyvalue); trackBy: getId"
                    [playerState]="player.value"
                    [deck]="deck"
                    [isDriver]="player.key === driverId">
  </shpp-player-hand>
</div>
<div *transloco="let t; read 'buttons'">
  <div class="d-flex justify-content-center align-items-center mb-2">
    <button class="btn btn-primary m-2 ms-0" (click)="revealCards()" [disabled]="!canReveal || !isDriver">{{ t('reveal') }}</button>
    <button *ngIf="!isBacklogGame" class="btn btn-primary m-2" (click)="endTurn()" [disabled]="canReveal || !isDriver">{{ t('newTurn') }}</button>
    <button *ngIf="!isDriver" class="btn btn-outline-secondary btn-sm m-2" (click)="claimDriver()">{{ t('claimDriver') }}</button>
  </div>
  <!-- Classic mode showed disabled Reveal/New-turn to non-drivers with no reason
       (backlog mode already explains it via the turn-summary hint). -->
  <p class="text-center small text-muted mb-4" *ngIf="!isDriver">{{ t('driver-only-hint') }}</p>
</div>
