<shpp-container>
  <ng-container navbar>
    <div class="d-flex flex-column flex-grow-1 min-w">
      <shpp-game-name class="d-flex" />
      <shpp-game-info class="d-flex" />
    </div>
    <shpp-nav-player-info />
  </ng-container>

  <ng-container content>
    <div class="offline-banner" role="status" *ngIf="(connected$ | async) === false">
      <span class="offline-banner__dot" aria-hidden="true"></span>
      <ng-container *transloco="let t">{{ t('ongoingGame.offline') }}</ng-container>
    </div>
    <h1 class="visually-hidden">{{ gameName }}</h1>
    <p class="visually-hidden" aria-live="polite" role="status">{{ announcement }}</p>
    <shpp-current-issue />
    <div class="game-body">
      <shpp-queue-rail />
      <div class="game-table-column">
        <shpp-card-table *ngIf="votingActive || showSummary" class="flex-grow-1" />
        <shpp-issue-resolved *ngIf="!showSummary && !votingActive && isResolved" class="flex-grow-1" />
      </div>
    </div>
    <shpp-turn-summary *ngIf="showSummary" class="bg-body-secondary" />
    <shpp-card-picker *ngIf="!showSummary && votingActive" class="bg-body-secondary" />
  </ng-container>
</shpp-container>
