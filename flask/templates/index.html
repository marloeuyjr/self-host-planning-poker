<!doctype html>
<html lang="en" data-critters-container>
<head>
  <!-- Production HTML shell: Flask renders this for every route. Mirror of
       angular/src/index.html <head>; keep meta/favicons/fonts/title in sync.
       See dpro-poker decisions P5.7. -->
  <meta charset="utf-8">
  <title>{{ app_title }}</title>
  <base href="{{ app_root }}">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="{{ app_root }}assets/icon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ app_root }}assets/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ app_root }}assets/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ app_root }}assets/favicon/favicon-16x16.png">
  <link rel="manifest" href="{{ app_root }}assets/favicon/site.webmanifest">
  <link rel="mask-icon" href="{{ app_root }}assets/favicon/safari-pinned-tab.svg" color="#10B981">
  <link rel="shortcut icon" href="{{ app_root }}assets/favicon/favicon.ico">
  <meta name="msapplication-TileColor" content="#0F172A">
  <meta name="msapplication-config" content="{{ app_root }}assets/favicon/browserconfig.xml">
  <meta name="theme-color" content="#0F172A">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Discrete weights only (400/500/600/700 + 400 italic) — not the full 200..900
       variable axis, which pulled far more font data than the UI uses. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mona+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">

  <link rel="stylesheet" href="{{ app_root }}styles.css">
</head>
<body>
  <shpp-root>
    <script src="{{ app_root }}runtime.js" type="module"></script>
    <script src="{{ app_root }}polyfills.js" type="module"></script>
    <script src="{{ app_root }}main.js" type="module"></script>
  </shpp-root>
</body>
</html>
